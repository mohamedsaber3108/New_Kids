services:
  usam-kids-web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      usam-kids-api:
        condition: service_healthy
  usam-kids-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in a protected .env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in a protected .env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in a protected .env file}
      MODERATOR_EMAIL: ${MODERATOR_EMAIL:-}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:-}
      LOG_REQUESTS: ${LOG_REQUESTS:-true}
      RESET_WEBHOOK_URL: ${RESET_WEBHOOK_URL:-}
      RESET_WEBHOOK_TOKEN: ${RESET_WEBHOOK_TOKEN:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_TOKEN: ${EMAIL_WEBHOOK_TOKEN:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_API_TOKEN: ${EMAIL_API_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_DAILY_LIMIT_PER_LEARNER: ${AI_DAILY_LIMIT_PER_LEARNER:-30}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      REQUIRE_GUARDIAN_CONSENT: ${REQUIRE_GUARDIAN_CONSENT:-true}
    volumes:
      - kids-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  kids-data:
