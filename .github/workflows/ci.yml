name: verify

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Unit, e2e, entrypoint, production build
        run: npm run verify
      - name: Real-browser gates (headless Chrome)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:ui

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Shell script syntax
        run: bash -n deploy/backup.sh && bash -n deploy/deploy.sh
      - name: Real images through the proxy
        run: npm run verify:docker
