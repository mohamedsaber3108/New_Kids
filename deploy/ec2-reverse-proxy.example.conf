# Example host configuration. Adjust certificate paths to your existing setup.
server {
  listen 80;
  server_name kids.usamif.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name kids.usamif.com;
  ssl_certificate /etc/letsencrypt/live/kids.usamif.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kids.usamif.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
