server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Real client IP for the API's per-IP rate limits. Only private/loopback hops (host Nginx via
  # the Docker bridge, or an AWS ALB inside the VPC) are trusted; the rightmost untrusted address in
  # X-Forwarded-For becomes $remote_addr, so a client cannot spoof it by sending its own header.
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from ::1;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Compress text assets (the app script is ~421 KB raw, ~127 KB gzipped). text/html is always on.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # IMPORTANT (nginx inheritance rule): add_header at server level is IGNORED by any location
  # that declares its own add_header. Every location that adds a header therefore repeats the
  # full security set below. scripts/verify-docker.mjs checks these headers on real responses.
  #
  # Page CSP: the SPA loads only same-origin scripts/API plus Google Fonts (index.html).
  # 'unsafe-inline' for styles covers React style attributes; scripts stay strictly 'self'.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    return 200 "ok\n";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    try_files $uri =404;
  }

  # API: the Node service sets its own strict headers (incl. its JSON CSP); Nginx adds none here
  # so responses are not duplicated. Server-level headers are inherited only because this block
  # declares no add_header of its own.
  location /api/ {
    proxy_pass http://usam-kids-api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
    client_max_body_size 32k;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }
}
